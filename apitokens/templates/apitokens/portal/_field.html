<div class="field{% if error %} has-error{% endif %}">
  <label for="{{ id }}">{{ label }}</label>
  <div class="input-wrap">
    <input type="{{ type|default:'text' }}" id="{{ id }}" name="{{ name }}" value="{{ value|default:'' }}"
           autocomplete="{{ autocomplete }}"{% if inputmode %} inputmode="{{ inputmode }}"{% endif %}{% if dir %} dir="{{ dir }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if autofocus %} autofocus{% endif %}
           maxlength="{{ maxlength }}" required autocapitalize="none" autocorrect="off" spellcheck="false"
           {% if error %}aria-invalid="true" {% endif %}aria-describedby="{{ id }}-msg">
    {% if type == "password" %}
    <button type="button" class="pw-toggle" data-for="{{ id }}" aria-pressed="false"
            aria-label="{{ T.portal_auth_show_password }}" data-show="{{ T.portal_auth_show_password }}" data-hide="{{ T.portal_auth_hide_password }}">
      <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
    {% endif %}
  </div>
  <span id="{{ id }}-msg">
    {% if error %}<span class="field-error" role="alert">{{ error }}</span>{% elif hint %}<span class="field-hint">{{ hint }}</span>{% endif %}
  </span>
</div>
