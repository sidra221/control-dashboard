<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>الرابط غير صالح · Link expired</title>
<style>
  :root { --bg: #f3f4f8; --card: #ffffff; --border: #e4e6ef; --text: #1a1d29; --muted: #6b7083; --accent: #6366f1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11121b; --card: #191b28; --border: #2b2e3f; --text: #eef0f8; --muted: #9095ab; --accent: #818cf8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif; line-height: 1.6;
  }
  .box {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; text-align: center;
  }
  .ico { font-size: 38px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
  .en { direction: ltr; }
</style>
</head>
<body>
  <main class="box">
    <div class="ico" aria-hidden="true">🔒</div>
    <section lang="ar" dir="rtl">
      <h1>هالرابط غير صالح أو انتهت صلاحيته</h1>
      <p>اطلب رابط جديد من مزوّد المتجر.</p>
    </section>
    <hr>
    <section class="en" lang="en" dir="ltr">
      <h1>This link is invalid or has expired</h1>
      <p>Please ask the store provider for a new link.</p>
    </section>
  </main>
</body>
</html>
