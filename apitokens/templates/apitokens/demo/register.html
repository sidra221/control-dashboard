{% extends "apitokens/demo/base.html" %}

{% block title %}إنشاء حساب — {{ store_name }}{% endblock %}

{% block content %}
<div class="wrap">
  <div class="auth-brand"><b>{{ store_name }}</b><small>ELEGANCE · RIYADH</small></div>
  <form class="auth-card" method="post" action="/demo/register/">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <h1>إنشاء حساب</h1>
    {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}
    <label for="name">الاسم</label>
    <input type="text" id="name" name="name" value="{{ values.name }}" autocomplete="name" maxlength="80" required>
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" value="{{ values.email }}" autocomplete="email" required dir="ltr">
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required dir="ltr">
    <button class="btn" type="submit">إنشاء الحساب</button>
    <p class="auth-alt">لديك حساب بالفعل؟ <a href="/demo/login/?next={{ next|urlencode }}">تسجيل الدخول</a></p>
  </form>
</div>
{% endblock %}
